# 🍎 Read-only: is the Sign in with Apple key good, so deleting an account
# also removes WordCat from the learner's Apple ID? Answer on the summary page.
name: 🍎 Apple 登入檢查

on:
  workflow_dispatch:
  push:
    branches: [claude/friendly-darwin-obc3r1]
    paths: [scripts/apple-signin-check.mjs, .github/workflows/apple-signin-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIWA_KEY_ID: ${{ secrets.APPLE_SIWA_KEY_ID }}
          APPLE_SIWA_PRIVATE_KEY: ${{ secrets.APPLE_SIWA_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: byyaepkhxexppjrdhcaw
        run: node scripts/apple-signin-check.mjs
