# Read-only look at the Supabase backend's push setup: which function secrets
# are stored (names only, never values) and whether a scheduled job calls the
# Live Activity reminder function every minute, with its last few runs.
# Changes nothing.
name: Backend status

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_REF: byyaepkhxexppjrdhcaw

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Function secrets (names only)
        run: |
          set -euo pipefail
          names=$(supabase secrets list --project-ref "$PROJECT_REF" -o json 2>/dev/null | jq -r '.[].name' | sort || true)
          if [ -z "$names" ]; then
            names=$(supabase secrets list --project-ref "$PROJECT_REF" 2>/dev/null | awk -F'|' 'NR>2 {gsub(/ /, "", $1); if ($1 != "") print $1}' | sort)
          fi
          echo "$names"
          for name in APNS_TEAM_ID APNS_KEY_ID APNS_PRIVATE_KEY APNS_BUNDLE_ID APNS_ENVIRONMENT CRON_SECRET \
                      APPLE_TEAM_ID APPLE_SIWA_KEY_ID APPLE_SIWA_PRIVATE_KEY ANTHROPIC_API_KEY; do
            if echo "$names" | grep -qx "$name"; then echo "OK      $name"; else echo "MISSING $name"; fi
          done

      - name: Scheduled reminder job
        run: |
          set -uo pipefail
          query() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg q "$1" '{query: $q}')"
          }
          echo "Extensions:"
          query "select extname from pg_extension where extname in ('pg_cron', 'pg_net')" | jq -c '.' || true
          echo "Jobs (the command itself is not printed; it may hold the cron secret):"
          query "select jobid, jobname, schedule, active, command like '%send-streak-live-activities%' as calls_reminders from cron.job" | jq -c '.' || true
          echo "Last runs of the reminder job:"
          query "select d.status, d.start_time, left(coalesce(d.return_message, ''), 120) as message from cron.job_run_details d join cron.job j using (jobid) where j.command like '%send-streak-live-activities%' order by d.start_time desc limit 5" | jq -c '.' || true
          echo "Recent HTTP responses from pg_net:"
          query "select status_code, left(coalesce(content::text, error_msg, ''), 160) as body, created from net._http_response order by created desc limit 5" | jq -c '.' || true
