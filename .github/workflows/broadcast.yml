# Sends a message to everyone using the app (or to guests, learners without
# Plus, or Plus members). The app shows each live message once, as a note
# the cat holds up, the next time it is opened or comes back. Run it from
# Actions > "Broadcast a message" > Run workflow.
#
# To take a message down early, set its `active` to false in the Supabase
# dashboard (Table editor > announcements), or let it expire.
#
# Uses the same secret as the backend deploy: SUPABASE_ACCESS_TOKEN.
name: Broadcast a message

on:
  workflow_dispatch:
    inputs:
      title_zh:
        description: '標題（中文介面，最多 80 字）'
        type: string
        required: true
      body_zh:
        description: '內容（中文介面，最多 600 字）'
        type: string
        required: true
      title_en:
        description: 'Title for the English interface (optional; falls back to Chinese)'
        type: string
        default: ''
      body_en:
        description: 'Body for the English interface (optional)'
        type: string
        default: ''
      audience:
        description: 'Who sees it (free = signed in without Premium; plus = Premium)'
        type: choice
        options: ['all', 'guest', 'free', 'plus']
        default: 'all'
      days:
        description: 'Days it stays live (0 = until taken down)'
        type: string
        default: '7'
      link:
        description: 'Optional: an https:// link, "plus" to open the Premium offer, or "update" to open TestFlight / the App Store'
        type: string
        default: ''
      link_label_zh:
        description: 'Optional: the link button in Chinese, e.g. 看看 Plus'
        type: string
        default: ''
      link_label_en:
        description: 'Optional: the link button in English'
        type: string
        default: ''
      push:
        description: 'Also send it as a push notification (to iPhones that allowed them)'
        type: boolean
        default: false
      require_version:
        description: 'Optional: force everyone below this version to update, e.g. 2.0.3, or 2.0.2 (4) for a build. The body becomes the update screen message.'
        type: string
        default: ''

permissions:
  contents: read

env:
  PROJECT_REF: byyaepkhxexppjrdhcaw

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Post the message
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TITLE_ZH: ${{ inputs.title_zh }}
          BODY_ZH: ${{ inputs.body_zh }}
          TITLE_EN: ${{ inputs.title_en }}
          BODY_EN: ${{ inputs.body_en }}
          AUDIENCE: ${{ inputs.audience }}
          DAYS: ${{ inputs.days }}
          LINK: ${{ inputs.link }}
          LINK_ZH: ${{ inputs.link_label_zh }}
          LINK_EN: ${{ inputs.link_label_en }}
          PUSH: ${{ inputs.push }}
          REQUIRE: ${{ inputs.require_version }}
        run: |
          set -euo pipefail
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "::error::days must be a whole number"; exit 1; }
          if [ -n "$LINK" ] && [ "$LINK" != "plus" ] && [ "$LINK" != "update" ] && [[ "$LINK" != https://* ]]; then
            echo "::error::link must start with https://, or be plus or update"; exit 1
          fi
          keys=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json --reveal 2>/dev/null \
            || supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          service=$(echo "$keys" | jq -r '([.[] | select(.name == "service_role")] + [.[] | select(.type == "secret")])[0].api_key')
          [ -n "$service" ] && [ "$service" != "null" ] || { echo "::error::Could not read the project's service key"; exit 1; }
          echo "::add-mask::$service"
          headers=(-H "apikey: $service" -H 'Content-Type: application/json' -H 'Prefer: return=representation')
          case "$service" in eyJ*) headers+=(-H "Authorization: Bearer $service") ;; esac
          if [ -n "$REQUIRE" ]; then
            [[ "$REQUIRE" =~ ^([0-9]+(\.[0-9]+){0,2})(\ \(([0-9]+)\))?$ ]] \
              || { echo "::error::require_version must look like 2.0.3 or 2.0.2 (4)"; exit 1; }
            min_version="${BASH_REMATCH[1]}"; min_build="${BASH_REMATCH[4]:-}"
            requirement=$(jq -n --arg v "$min_version" --arg b "$min_build" --arg mz "${BODY_ZH:0:300}" --arg me "${BODY_EN:0:300}" \
              '{min_version: $v, min_build: (if $b == "" then null else ($b | tonumber) end), message_zh: $mz, message_en: $me}')
            required=$(curl -sS -w '\n%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/rest/v1/update_requirements" "${headers[@]}" -d "$requirement")
            [ "$(echo "$required" | tail -1)" = "201" ] || { echo "::error::The update requirement failed: $(echo "$required" | sed '$d')"; exit 1; }
            echo "Everyone below $REQUIRE now sees only the update screen (next open or return, within ten minutes)."
            echo "To lift it: set active to false on the newest row of update_requirements in the Supabase dashboard."
          fi
          ends=null
          if [ "$DAYS" != "0" ]; then ends="\"$(date -u -d "+$DAYS days" +%Y-%m-%dT%H:%M:%SZ)\""; fi
          body=$(jq -n --arg tz "$TITLE_ZH" --arg bz "$BODY_ZH" --arg te "$TITLE_EN" --arg be "$BODY_EN" \
            --arg aud "$AUDIENCE" --arg link "$LINK" --arg lz "$LINK_ZH" --arg le "$LINK_EN" --argjson ends "$ends" \
            --argjson push "$PUSH" \
            '{title_zh: $tz, body_zh: $bz, title_en: $te, body_en: $be, audience: $aud, ends_at: $ends, push: $push,
              link: (if $link == "" then null else $link end), link_label_zh: $lz, link_label_en: $le}')
          reply=$(curl -sS -w '\n%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/rest/v1/announcements" "${headers[@]}" -d "$body")
          status=$(echo "$reply" | tail -1)
          echo "$reply" | sed '$d' | jq -c '.[0] | {id, audience, title_zh, ends_at, push}' || true
          [ "$status" = "201" ] || { echo "::error::Posting failed with HTTP $status"; exit 1; }
          echo "Posted. The app shows it once, the next time each learner opens it or comes back."
          if [ "$PUSH" = "true" ]; then
            id=$(echo "$reply" | sed '$d' | jq -r '.[0].id')
            pushed=$(curl -sS -w '\n%{http_code}' -X POST "https://$PROJECT_REF.supabase.co/functions/v1/broadcast-push" \
              -H 'Content-Type: application/json' -d "{\"id\":\"$id\"}")
            echo "Push: $(echo "$pushed" | sed '$d')"
            [ "$(echo "$pushed" | tail -1)" = "200" ] || { echo "::error::The push was not sent; the in-app message is posted"; exit 1; }
          fi
