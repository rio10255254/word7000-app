# Builds and checks the native SwiftUI app (ios/) on a Mac:
#   1. the learning engine's tests, including the golden results shared with
#      the React Native app (parity.json),
#   2. a simulator build plus a UI walk-through that screenshots every main
#      screen in light and dark mode on iOS 18, 26, and 27.
# Screenshots are uploaded as an artifact and pushed to the
# `native-screenshots` branch so they can be viewed from a phone.
name: Native iOS
# A full manual run is named so a release can recognise it and reuse it for
# identical source (see ios-release.yml) instead of testing the same code again.
run-name: "${{ inputs.checks && format('Native iOS: {0} checks', inputs.checks) || github.event.head_commit.message }}"

on:
  push:
    branches: ['master', 'native/**']
    paths:
      - 'ios/**'
      - 'src/data/words.ts'
      - 'src/lib/progress.ts'
      - 'src/lib/studySession.ts'
      - 'src/lib/scanParser.ts'
      - 'src/nativeParity.test.ts'
      - 'scripts/export-native-words.mjs'
      - 'scripts/verify-native-release.py'
      - 'scripts/test_verify_native_release.py'
      - 'scripts/build-native-speaking-library.mjs'
      - 'scripts/test-native-speaking-recency.mjs'
      - 'src/nativeSpeakingRecency.test.ts'
      - 'content/speaking/**'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
    inputs:
      checks:
        description: 'Full regression, bilingual screenshots, or focused coach input/compatibility checks'
        type: choice
        options: ['all', 'copy', 'coach', 'compile', 'polish', 'layout']
        default: 'all'

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}-${{ inputs.checks || 'all' }}
  cancel-in-progress: true

jobs:
  native:
    name: Native iOS ${{ matrix.ios }}
    if: inputs.checks != 'layout'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios: 18
            xcode: 26
            runner: macos-15
          - ios: 26
            xcode: 26
            runner: macos-15
          - ios: 27
            xcode: 27
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    # The full iOS 27 walk-through on the xcode-27 runners takes 50-55 minutes,
    # too close to an hour once the simulator is slow to boot.
    timeout-minutes: 90
    env:
      IOS_MAJOR: ${{ matrix.ios }}
      XCODE_MAJOR: ${{ matrix.xcode }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            echo "::error::Xcode $XCODE_MAJOR is not installed on this runner."
            exit 1
          fi
          echo "Using $XCODE"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Save SDK interfaces used for new APIs
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for fw in Vision FoundationModels Speech; do
            f=$(find "$SDK/System/Library/Frameworks/$fw.framework" -name "arm64e-apple-ios.swiftinterface" 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp "$f" "$RUNNER_TEMP/screenshots/api-$fw.swiftinterface.txt"; fi
          done
          ls -la "$RUNNER_TEMP/screenshots"

      - name: Word list matches the app data
        run: node scripts/export-native-words.mjs --check

      - name: Speaking questions match their editorial sources
        run: node scripts/build-native-speaking-library.mjs --check

      - name: Coaching evaluation cases match their authored sources
        run: node scripts/build-coach-evaluation.mjs --check

      - name: Release archive checks
        run: python3 -m unittest discover -s scripts -p 'test_verify_native_release.py'

      - name: Learning engine tests
        run: |
          xcodebuild -version
          swift test --package-path ios/Packages/Word7000Core
          swift run --package-path ios/Packages/Word7000Core CoachEvaluation --validate content/coach-evaluation/cases.generated.json
          swift run --package-path ios/Packages/Word7000Core CoachEvaluation --probe

      - name: Speaking history account isolation
        run: node scripts/test-native-speaking-recency.mjs

      - name: Pick an iPhone simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          devices = json.load(sys.stdin)["devices"]
          requested_major = int(os.environ["IOS_MAJOR"])
          def version(runtime):
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return tuple(int(x) for x in match.groups()) if match else (0, 0)
          best = None
          for runtime, items in devices.items():
              if version(runtime)[0] != requested_major:
                  continue
              for item in items:
                  name = item["name"]
                  # The wide iPhone Duo turns the tab bar into a side rail,
                  # which the UI checks are not written for; never test on it.
                  if not name.startswith("iPhone") or "Duo" in name:
                      continue
                  preferred = "SE" in name if requested_major == 18 else "Pro" in name and "Max" not in name
                  # The usual phone shape beats a newer point release.
                  score = (preferred, version(runtime), name)
                  if best is None or score > best[0]:
                      best = (score, item["udid"], name, runtime)
          if best is None:
              sys.exit(f"No available iOS {requested_major} iPhone simulator")
          print(best[1])
          print(best[2], best[3], file=sys.stderr)
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run the UI walk-through
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          if [ "$CHECKS" = "compile" ]; then
            set +e
            xcodebuild build -project ios/Word7000.xcodeproj -scheme Word7000 \
              -destination "id=$SIMULATOR_UDID" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1
            status=$?
            grep -E "error:|warning:|\*\* BUILD" "$RUNNER_TEMP/xcodebuild.log" | tail -100
            exit $status
          fi
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          swift ios/Tests/create-scan-photos.swift "$RUNNER_TEMP/scan-fixtures"
          xcrun simctl launch "$SIMULATOR_UDID" com.apple.mobileslideshow || true
          xcrun simctl addmedia "$SIMULATOR_UDID" "$RUNNER_TEMP"/scan-fixtures/*
          set +e
          TEST_SELECTION=()
          if [ "$CHECKS" = "copy" ]; then
            TEST_SELECTION=(-only-testing:Word7000UITests/ScreenshotTests/testChineseModeScreens -only-testing:Word7000UITests/ScreenshotTests/testLightScreens)
          elif [ "$CHECKS" = "coach" ]; then
            TEST_SELECTION=(-only-testing:Word7000UITests/SpeakingCoachTests -only-testing:Word7000UITests/ScanPickerTests/testSpeakingChoicesRemainVisibleAfterScanningAnUnsupportedWord -only-testing:Word7000UITests/ScreenshotTests/testChineseModeScreens)
          elif [ "$CHECKS" = "polish" ]; then
            TEST_SELECTION=(-only-testing:Word7000UITests/SpeakingCoachTests/testEditorialNotesAreReachableInBothLanguages -only-testing:Word7000UITests/SpeakingCoachTests/testAISettingsDisableSuggestionsButKeepRecordingAndText -only-testing:Word7000UITests/SpeakingCoachTests/testMockAIDisabledStillExplainsStatusAndAllowsPractice -only-testing:Word7000UITests/SpeakingCoachTests/testRecordingReviewPlaybackAndDeletionWithExplicitFixture -only-testing:Word7000UITests/SpeakingCoachTests/testNativeRecorderPermissionTimerPlaybackAndCleanup -only-testing:Word7000UITests/ScreenshotTests/testHistoryEmptyState -only-testing:Word7000UITests/ScreenshotTests/testLightScreens)
          fi
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild build-for-testing \
            -project ios/Word7000.xcodeproj \
            -scheme Word7000 \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "error:|\*\* (BUILD|TEST)" "$RUNNER_TEMP/xcodebuild.log" | tail -100
            exit $status
          fi
          # The first launch after installing on a freshly booted simulator can
          # outlast XCTest's launch window ("Timed out while acquiring background
          # assertion", seen on iOS 27), failing whichever test happens to run
          # first. Launch the app once here so the tests start warm.
          APP=$(find "$DERIVED/Build/Products" -maxdepth 2 -type d -name Word7000.app -path '*iphonesimulator*' | head -1)
          if [ -n "$APP" ]; then
            xcrun simctl install "$SIMULATOR_UDID" "$APP" \
              && xcrun simctl launch "$SIMULATOR_UDID" com.rio.word7000 -uiTestingReset -uiTestingLight \
              && sleep 10
            xcrun simctl terminate "$SIMULATOR_UDID" com.rio.word7000 || true
          fi
          xcodebuild test-without-building \
            -project ios/Word7000.xcodeproj \
            -scheme Word7000 \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED" \
            -parallel-testing-enabled NO \
            "${TEST_SELECTION[@]}" \
            -resultBundlePath "$RUNNER_TEMP/Word7000.xcresult" \
            CODE_SIGNING_ALLOWED=NO >> "$RUNNER_TEMP/xcodebuild.log" 2>&1
          status=$?
          grep -E "error:|Test Case|\*\* (BUILD|TEST)" "$RUNNER_TEMP/xcodebuild.log" | tail -200
          exit $status

      - name: Coach Release build excludes debug responses
        if: inputs.checks == 'coach' || inputs.checks == 'polish'
        run: |
          set -euo pipefail
          xcodebuild build -project ios/Word7000.xcodeproj -scheme Word7000 \
            -configuration Release -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/CoachRelease" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/coach-release.log" 2>&1
          python3 - "$RUNNER_TEMP/CoachRelease/Build/Products/Release-iphonesimulator/Word7000.app/Word7000" "$RUNNER_TEMP/screenshots/coach-release-verification.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          binary = Path(sys.argv[1])
          assert binary.is_file(), 'Release app executable is missing'
          assert b'-uiTestingCoach' not in binary.read_bytes(), 'Release app contains coach test fixtures'
          assert b'-uiTestingRecording' not in binary.read_bytes(), 'Release app contains recording test fixtures'
          Path(sys.argv[2]).write_text(json.dumps({'commit': os.environ['GITHUB_SHA'], 'coachTestFixturesExcluded': True}))
          print('Release app built successfully without coach test fixtures')
          PY

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots"
          cp "$HOME"/word7000-screenshots/*.png "$RUNNER_TEMP/screenshots/" 2>/dev/null || true
          cp "$HOME"/word7000-screenshots/*-hierarchy.txt "$RUNNER_TEMP/screenshots/" 2>/dev/null || true
          cp "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/screenshots/" 2>/dev/null || true
          cp "$RUNNER_TEMP/coach-release.log" "$RUNNER_TEMP/screenshots/" 2>/dev/null || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 10m --style compact \
            --predicate 'process CONTAINS "Photos" OR process CONTAINS "photolibrary"' \
            > "$RUNNER_TEMP/screenshots/photos-system.log" 2>/dev/null || true
          ls -la "$RUNNER_TEMP/screenshots"
          tail -n 80 "$RUNNER_TEMP/xcodebuild.log" > "$RUNNER_TEMP/screenshots/xcodebuild-tail.txt" 2>/dev/null || true
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -100 > "$RUNNER_TEMP/screenshots/errors.txt" 2>/dev/null || true
          xcodebuild -version > "$RUNNER_TEMP/screenshots/environment.txt"
          xcrun simctl list devices available >> "$RUNNER_TEMP/screenshots/environment.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots-${{ github.run_number }}-ios-${{ matrix.ios }}
          path: ${{ runner.temp }}/screenshots
          retention-days: 14

  publish-screenshots:
    needs: native
    if: always() && github.event_name != 'pull_request' && (inputs.checks == '' || inputs.checks == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-screenshots-${{ github.run_number }}-ios-*
          path: screenshots

      - name: Publish screenshots to the native-screenshots branch
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/screenshots"
          echo "${{ github.sha }} run ${{ github.run_number }}" > SOURCE.txt
          git init -q
          git checkout -q -b native-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-screenshots

  # Today must fit every iPhone. Runs the layout checks on phones of each
  # size (standard, Pro Max, SE, mini, Air) and pushes the screenshots to
  # the `native-layout-screenshots` branch.
  layout:
    name: Today layout on each iPhone size
    if: inputs.checks == 'layout'
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$XCODE" ] || { echo "::error::Xcode 26 is not installed on this runner."; exit 1; }
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set +e
          xcodebuild build-for-testing -project ios/Word7000.xcodeproj -scheme Word7000 \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          grep -E "error:|\*\* (BUILD|TEST)" "$RUNNER_TEMP/build.log" | tail -60
          exit $status

      - name: Run the layout checks on each phone
        run: |
          set +e
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          xcrun simctl list runtimes > "$OUT/runtimes.txt"
          xcrun simctl list devicetypes > "$OUT/devicetypes.txt"
          failed=0
          tested=0
          # The phones are read on descriptor 3 so nothing in the loop can swallow them from stdin.
          while IFS='|' read -r MAJOR TYPE <&3; do
            ids=$(python3 - "$MAJOR" "$TYPE" <<'PY'
          import json, re, subprocess, sys
          major, name = int(sys.argv[1]), sys.argv[2]
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          def version(r): return tuple(int(x) for x in r["version"].split("."))
          matching = [r for r in runtimes if r.get("isAvailable") and r["platform"] == "iOS" and version(r)[0] == major]
          if not matching: sys.exit(0)
          runtime = max(matching, key=version)
          supported = {t["name"]: t["identifier"] for t in runtime.get("supportedDeviceTypes", [])}
          if name in supported: print(runtime["identifier"], supported[name])
          PY
          )
            if [ -z "$ids" ]; then echo "Skipping $TYPE on iOS $MAJOR: not available here"; continue; fi
            RUNTIME=${ids%% *}
            TYPE_ID=${ids##* }
            SLUG=$(echo "ios$MAJOR-$TYPE" | tr ' ()' '-__' | tr -s '-' | tr -d '_')
            UDID=$(xcrun simctl create "layout-$SLUG" "$TYPE_ID" "$RUNTIME")
            if [ -z "$UDID" ]; then echo "Could not create $TYPE"; continue; fi
            echo "::group::$TYPE on iOS $MAJOR"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
            rm -rf "$HOME/word7000-screenshots"
            xcodebuild test-without-building -project ios/Word7000.xcodeproj -scheme Word7000 \
              -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -parallel-testing-enabled NO -only-testing:Word7000UITests/LayoutTests \
              CODE_SIGNING_ALLOWED=NO > "$OUT/$SLUG.log" 2>&1
            status=$?
            grep -E "LAYOUT|error:|Test Case .*(passed|failed)|\*\* TEST" "$OUT/$SLUG.log" | tail -80
            echo "::endgroup::"
            if [ $status -ne 0 ]; then failed=1; echo "::error::Layout checks failed on $TYPE (iOS $MAJOR)"; fi
            tested=$((tested + 1))
            for f in "$HOME"/word7000-screenshots/*; do [ -e "$f" ] && mv "$f" "$OUT/$SLUG-$(basename "$f")"; done
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          done 3<<'PHONES'
          26|iPhone 17
          26|iPhone 17 Pro Max
          18|iPhone SE (3rd generation)
          26|iPhone SE (3rd generation)
          26|iPhone 13 mini
          26|iPhone Air
          PHONES
          echo "Tested $tested phones"
          [ $tested -gt 0 ] || exit 1
          exit $failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-${{ github.run_number }}
          path: ${{ runner.temp }}/screenshots
          retention-days: 14

      - name: Publish the screenshots to the native-layout-screenshots branch
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/screenshots"
          echo "${{ github.sha }} run ${{ github.run_number }}" > SOURCE.txt
          git init -q
          git checkout -q -b native-layout-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Layout screenshots for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-layout-screenshots
