# Ships the iOS app from GitHub, so no computer is needed.
#
# Run it from the Actions tab (iOS release > Run workflow), or from a Claude
# session. It needs one repository secret, EXPO_TOKEN (an Expo access token):
# Settings > Secrets and variables > Actions > New repository secret.
#
#   build-testflight  Builds on Expo's servers with the iOS credentials Expo
#                     already stores, then uploads the build to TestFlight.
#   ota-update        Sends JavaScript and UI changes to installed builds of
#                     the same app version, without a new TestFlight build.
#   native-testflight Builds the native SwiftUI app in ios/ (see
#                     ios/Release/README.md) and uploads it to TestFlight.
name: iOS release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'build-testflight: React Native build to TestFlight. ota-update: push JS/UI changes to installed RN builds. native-testflight: native SwiftUI build to TestFlight.'
        type: choice
        options: ['build-testflight', 'ota-update', 'native-testflight']
        default: 'build-testflight'
      message:
        description: 'Short note shown for an OTA update'
        type: string
        default: ''
      native_validation_run:
        description: 'Optional full Native iOS run ID (push, or manual with all checks) for identical source; otherwise a passed run of identical source, then this commit'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Never cancel a build or upload that is already running.
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.operation == 'native-testflight' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the Expo token
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::The EXPO_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Prepare the Mac for a signed native build
        if: inputs.operation == 'native-testflight'
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          fastlane --version
          pod --version

      - run: npm ci

      # A release should never carry a change that breaks the tests.
      - run: npm run typecheck
      - run: npm test

      - name: Check reminder ownership and legacy progress compatibility
        if: inputs.operation == 'native-testflight'
        run: |
          npm install --prefix "$RUNNER_TEMP/sql-check" --no-audit --no-fund @electric-sql/pglite@0.5.10
          node scripts/test-backend-reconciliation.mjs "$RUNNER_TEMP/sql-check/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Check native archive verification
        if: inputs.operation == 'native-testflight'
        run: python3 -m unittest discover -s scripts -p 'test_verify_native_release.py'

      - name: Pin full native validation to the release source
        if: inputs.operation == 'native-testflight'
        env:
          REQUESTED_RUN: ${{ inputs.native_validation_run }}
        run: |
          set -euo pipefail
          # Release orchestration and its portable settings-check harness may differ.
          # All shipped code/data and the native core/UI tests must still match.
          # The portable harness is executed by npm test above, including on Linux.
          same_source() {
            git diff --quiet "$1" "$GITHUB_SHA" -- . ':(exclude).github/workflows/ios-release.yml' ':(exclude)ios/Tests/SpeakingRecencyChecks.swift'
          }
          RUN_ID="$REQUESTED_RUN"
          if [ -z "$RUN_ID" ]; then
            # A full run that already passed on identical source, usually on the
            # pull request branch before merging, is not repeated after the merge.
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-native.yml/runs?status=success&per_page=40" \
              --jq '.workflow_runs[] | select(.event == "push" or (.event == "workflow_dispatch" and .display_title == "Native iOS: all checks")) | "\(.id) \(.head_sha)"' \
              > "$RUNNER_TEMP/passed-native-runs.txt"
            while read -r id sha; do
              if git cat-file -e "$sha^{commit}" 2>/dev/null && same_source "$sha"; then
                RUN_ID="$id"
                echo "Reusing full native validation $id from $sha: the source is identical."
                break
              fi
            done < "$RUNNER_TEMP/passed-native-runs.txt"
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ios-native.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=20" --jq '.workflow_runs[0].id // empty')
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::A full Native iOS run is required."; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/native-validation.json"
          # A push run is always the full suite; a manual run counts only with checks=all.
          TESTED_SHA=$(node -e 'const r=require(process.argv[1]); const full = r.event==="push" || (r.event==="workflow_dispatch" && r.display_title==="Native iOS: all checks"); if(r.path!==".github/workflows/ios-native.yml" || !full || !/^[a-f0-9]{40}$/.test(r.head_sha)) throw new Error("Not a full native run"); if(r.status==="completed" && r.conclusion!=="success") throw new Error("Native validation failed"); process.stdout.write(r.head_sha);' "$RUNNER_TEMP/native-validation.json")
          git diff --exit-code "$TESTED_SHA" "$GITHUB_SHA" -- . ':(exclude).github/workflows/ios-release.yml' ':(exclude)ios/Tests/SpeakingRecencyChecks.swift'
          echo "NATIVE_VALIDATION_RUN=$RUN_ID" >> "$GITHUB_ENV"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and upload to TestFlight
        if: inputs.operation == 'build-testflight'
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait

      - name: Publish an OTA update
        if: inputs.operation == 'ota-update'
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          eas update --channel production --environment production --platform ios --non-interactive \
            --message "${MESSAGE:-$(git log -1 --pretty=%s)}"

      - name: Build the native app and upload it to TestFlight
        if: inputs.operation == 'native-testflight'
        env:
          # App Store Connect API key for uploading straight to Apple. Without
          # all three, the upload falls back to Expo's submit service.
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/export-native-words.mjs --check
          node scripts/build-native-speaking-library.mjs --check
          STAGE="$RUNNER_TEMP/native"
          mkdir -p "$STAGE"
          cp -R ios "$STAGE/ios"
          rm -rf "$STAGE/ios/Release" "$STAGE/ios/PARITY.md"
          cp ios/Release/app.json ios/Release/eas.json ios/Release/package.json ios/Release/package-lock.json "$STAGE/"
          cp ios/Release/Podfile "$STAGE/ios/Podfile"
          cd "$STAGE"
          EAS_NO_VCS=1 eas build:version:get --platform ios --profile production --json > "$RUNNER_TEMP/native-version.json"
          NEXT_BUILD=$(node -e 'const fs = require("fs"); const version = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const current = Number(version.buildNumber); if (!Number.isSafeInteger(current) || current < 1) throw new Error("Invalid remote build number"); process.stdout.write(String(current + 1));' "$RUNNER_TEMP/native-version.json")
          node "$GITHUB_WORKSPACE/scripts/prepare-native-release.mjs" "$STAGE" "$NEXT_BUILD"
          # EAS manages the existing signing credentials; Xcode runs on this Mac.
          # No EAS cloud-build allocation or new paid subscription is required.
          EAS_NO_VCS=1 eas build --local --platform ios --profile production --non-interactive \
            --output "$RUNNER_TEMP/native.ipa"
          node -e 'const fs=require("fs"); fs.writeFileSync(process.argv[1], JSON.stringify([{status:"FINISHED",buildProvider:"github-actions-local",gitCommitHash:process.env.GITHUB_SHA,appVersion:require("./app.json").expo.version,appBuildVersion:process.argv[2]}]));' "$RUNNER_TEMP/native-build.json" "$NEXT_BUILD"
          python3 "$GITHUB_WORKSPACE/scripts/verify-native-release.py" \
            --archive "$RUNNER_TEMP/native.ipa" --metadata "$RUNNER_TEMP/native-build.json" \
            --words "$GITHUB_WORKSPACE/ios/Word7000/Resources/words.json" \
            --expected-build "$NEXT_BUILD" --expected-version "$(node -p 'require("./app.json").expo.version')" \
            > "$RUNNER_TEMP/native-verification.json"
          python3 - "$RUNNER_TEMP/native.ipa" "$RUNNER_TEMP/native-verification.json" <<'PY'
          import json, plistlib, sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as archive:
              name = next(n for n in archive.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and '/PlugIns/' not in n)
              info = plistlib.loads(archive.read(name))
              executable = name.rsplit('/', 1)[0] + '/' + info['CFBundleExecutable']
              if b'-uiTestingCoach' in archive.read(executable):
                  raise SystemExit('Coach test fixtures must not ship in a Release app')
              if b'-uiTestingRecording' in archive.read(executable):
                  raise SystemExit('Recording test fixtures must not ship in a Release app')
          receipt = Path(sys.argv[2])
          verified = json.loads(receipt.read_text())
          verified['coachTestFixturesExcluded'] = True
          receipt.write_text(json.dumps(verified))
          PY
          cat "$RUNNER_TEMP/native-verification.json"
          PASSED=false
          for attempt in $(seq 1 60); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_VALIDATION_RUN" > "$RUNNER_TEMP/native-validation.json"
            STATE=$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.status==="completed" ? r.conclusion : r.status);' "$RUNNER_TEMP/native-validation.json")
            if [ "$STATE" = success ]; then PASSED=true; break; fi
            case "$STATE" in queued|in_progress|pending|requested|waiting) ;; *) echo "::error::Native validation ended with $STATE. Not submitting to TestFlight."; exit 1 ;; esac
            echo "Waiting for full native validation $NATIVE_VALIDATION_RUN ($STATE)."
            sleep 60
          done
          [ "$PASSED" = true ] || { echo "::error::Native validation did not finish. Not submitting to TestFlight."; exit 1; }
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            # Straight to Apple. Expo's submit queue once added half an hour,
            # and once lost the result to a network error after scheduling.
            KEY_DIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEY_DIR"
            KEY="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
            trap 'rm -f "$KEY"' EXIT
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY"
            chmod 600 "$KEY"
            xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/native.ipa" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
            echo "Uploaded to App Store Connect. Apple processes the build for TestFlight in about 5-15 minutes."
          else
            EAS_NO_VCS=1 eas submit --platform ios --profile production --path "$RUNNER_TEMP/native.ipa" --non-interactive --wait
          fi

      - name: Save the native release verification receipt
        if: always() && inputs.operation == 'native-testflight'
        uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-build.json
            ${{ runner.temp }}/native-verification.json
          retention-days: 7
