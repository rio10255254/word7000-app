# 📣 Send a message to the installed apps: full screen the next time each
# 使用說明：docs/遠端控制說明.md
# learner opens the app, optionally as a push. Run from Actions, or ask Claude.
name: 📣 發公告

run-name: "${{ inputs.dry_run && '👀 預覽' || '📣 已發出' }}：${{ inputs.title_zh }}"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '👀 只預覽（勾著＝不會真的發出；確認內容後取消勾選再按一次才會發出）'
        type: boolean
        default: true
      title_zh:
        description: '① 中文標題（例：新版口說練習上線了）'
        type: string
        required: true
      body_zh:
        description: '② 中文內容（最多 600 字）'
        type: string
        required: true
      title_en:
        description: '③ 英文標題（英文介面的人看到；不填就顯示中文）'
        type: string
        default: ''
      body_en:
        description: '④ 英文內容（不填就顯示中文）'
        type: string
        default: ''
      push:
        description: '🔔 同時推播到手機鎖定畫面（重要的才勾）'
        type: boolean
        default: false
      audience:
        description: '👥 給誰看（測試公告請選「只給測試手機」：只有在 App 裡長按「公告推播」設成測試機的手機會收到）'
        type: choice
        options: ['所有人', '只給測試手機', '沒登入的訪客', '登入但沒訂閱', 'Premium 訂閱者']
        default: '所有人'
      button:
        description: '🔘 公告下方的按鈕'
        type: choice
        options: ['沒有按鈕', '請大家更新', '打開訂閱頁', '打開網址']
        default: '沒有按鈕'
      url:
        description: '🔗 按鈕選「打開網址」才要填：https:// 開頭'
        type: string
        default: ''
      only_below_version:
        description: '📱 只給舊版本看（選填，例 2.0.3 或 2.0.2 (4)）；留空＝所有版本'
        type: string
        default: ''
      days:
        description: '⏳ 公告留幾天（0 = 直到手動下架）'
        type: string
        default: '7'

permissions:
  contents: read

env:
  PROJECT_REF: byyaepkhxexppjrdhcaw

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 發公告
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          ACTION: post
          TITLE_ZH: ${{ inputs.title_zh }}
          BODY_ZH: ${{ inputs.body_zh }}
          TITLE_EN: ${{ inputs.title_en }}
          BODY_EN: ${{ inputs.body_en }}
          PUSH: ${{ inputs.push }}
          AUDIENCE_LABEL: ${{ inputs.audience }}
          BUTTON: ${{ inputs.button }}
          URL: ${{ inputs.url }}
          BELOW: ${{ inputs.only_below_version }}
          DAYS: ${{ inputs.days }}
        run: |
          case "$AUDIENCE_LABEL" in
            只給測試手機) export AUDIENCE=tester ;;
            沒登入的訪客) export AUDIENCE=guest ;;
            登入但沒訂閱) export AUDIENCE=free ;;
            "Premium 訂閱者") export AUDIENCE=plus ;;
            *) export AUDIENCE=all ;;
          esac
          case "$BUTTON" in
            請大家更新) export LINK=update ;;
            打開訂閱頁) export LINK=plus ;;
            打開網址) export LINK="$URL" ;;
            *) export LINK= ;;
          esac
          scripts/remote-control.sh
