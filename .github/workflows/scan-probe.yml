name: Scan probe
on:
  push:
    branches: ['claude/scan-probe']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers; swift probe/probe.swift probe/page.jpg
