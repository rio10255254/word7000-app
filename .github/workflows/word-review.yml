# Has Claude proofread the word list through the Message Batches API, applies
# the corrections that pass the data rules, runs the content audits and commits
# the result to the branch this workflow runs on, with a report of every change.
#
# Repository secret: ANTHROPIC_API_KEY (the same key the AI backend uses).
#
# Start it from the Actions tab (once this file is on the default branch), or
# by pushing exports/claude-review/request.json to a feature branch, e.g.
#   {"model": "claude-opus-5-5", "effort": "medium", "cores": "1-14", "limit": 0}
# A batch usually ends within an hour. If it is still running when the wait
# below runs out, start again with "batch_id" set to collect it.
name: Word review

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Claude model'
        type: choice
        options: ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5']
        default: 'claude-opus-5-5'
      effort:
        description: 'Reasoning effort'
        type: choice
        options: ['low', 'medium', 'high']
        default: 'medium'
      cores:
        description: 'Levels to review, such as 1-14 or 1,3'
        type: string
        default: '1-14'
      limit:
        description: 'Review only the first N of those words (0 = all of them)'
        type: string
        default: '0'
      batch_id:
        description: 'Collect this earlier batch instead of starting a new one'
        type: string
        default: ''
  push:
    branches-ignore: ['master', 'native/**']
    paths: ['exports/claude-review/request.json']

permissions:
  contents: write

concurrency:
  group: word-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check the branch and the key
        run: |
          case "$GITHUB_REF_NAME" in
            master|native/*) echo "::error::Run this on a feature branch; it commits the corrections for review in a pull request."; exit 1 ;;
          esac
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::Add the ANTHROPIC_API_KEY repository secret first."; exit 1; }

      - uses: actions/checkout@v4

      - name: Read the request
        id: request
        env:
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_EFFORT: ${{ inputs.effort }}
          INPUT_CORES: ${{ inputs.cores }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_BATCH_ID: ${{ inputs.batch_id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            model=$INPUT_MODEL; effort=$INPUT_EFFORT; cores=$INPUT_CORES; limit=$INPUT_LIMIT; batch_id=$INPUT_BATCH_ID
          else
            file=exports/claude-review/request.json
            read_key() { jq -r --arg key "$1" --arg fallback "$2" '.[$key] // $fallback | tostring' "$file"; }
            model=$(read_key model claude-opus-5-5); effort=$(read_key effort medium); cores=$(read_key cores 1-14)
            limit=$(read_key limit 0); batch_id=$(read_key batch_id "")
          fi
          [[ "$batch_id" =~ ^(msgbatch_[A-Za-z0-9]+)?$ ]] || { echo "::error::batch_id does not look like a batch id"; exit 1; }
          { echo "model=$model"; echo "effort=$effort"; echo "cores=$cores"; echo "limit=$limit"; echo "batch_id=$batch_id"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Start the batch
        id: submit
        if: steps.request.outputs.batch_id == ''
        env:
          MODEL: ${{ steps.request.outputs.model }}
          EFFORT: ${{ steps.request.outputs.effort }}
          CORES: ${{ steps.request.outputs.cores }}
          LIMIT: ${{ steps.request.outputs.limit }}
        run: node scripts/claude-review-words.mjs submit --model "$MODEL" --effort "$EFFORT" --cores "$CORES" --limit "$LIMIT"

      - name: Wait for the batch
        env:
          BATCH_ID: ${{ steps.request.outputs.batch_id || steps.submit.outputs.batch_id }}
        run: node scripts/claude-review-words.mjs wait "$BATCH_ID" --minutes 300

      - name: Collect the corrections
        id: collect
        env:
          BATCH_ID: ${{ steps.request.outputs.batch_id || steps.submit.outputs.batch_id }}
        run: |
          node scripts/claude-review-words.mjs collect "$BATCH_ID"
          cat "exports/claude-review/$BATCH_ID/REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the corrections
        env:
          OUT: ${{ steps.collect.outputs.out_dir }}
        run: |
          [ "${{ steps.collect.outputs.meanings }}" = "0" ] || node scripts/apply-meaning-corrections.mjs "$OUT/meaning-corrections.json"
          [ "${{ steps.collect.outputs.examples }}" = "0" ] || node scripts/apply-example-corrections.mjs "$OUT/example-corrections.json"
          node scripts/claude-review-words.mjs sync
          node scripts/export-native-words.mjs

      - name: Run the content checks
        run: |
          npx vitest run src/data scripts/claude-review-words.test.mjs
          npm run validate:meanings
          npm run audit:meanings
          npm run audit:examples
          npm run audit:examples:zh-tw

      - name: Keep the report even if a check failed
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-${{ steps.request.outputs.batch_id || steps.submit.outputs.batch_id }}
          path: ${{ steps.collect.outputs.out_dir }}

      - name: Commit the result
        env:
          BATCH_ID: ${{ steps.request.outputs.batch_id || steps.submit.outputs.batch_id }}
          MEANINGS: ${{ steps.collect.outputs.meanings }}
          EXAMPLES: ${{ steps.collect.outputs.examples }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data ios/Word7000/Resources/words.json "exports/claude-review/$BATCH_ID"
          git commit -m "Apply Claude's word review $BATCH_ID" -m "$MEANINGS meaning and $EXAMPLES example corrections; see exports/claude-review/$BATCH_ID/REPORT.md."
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
