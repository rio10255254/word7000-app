<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
    <meta content="noindex, nofollow, noarchive" name="robots" />
    <meta content="no-store" http-equiv="cache-control" />
    <meta content="#f8fafc" name="theme-color" />
    <title>Returning to Word7000</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #172033;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }

      .mark {
        align-items: center;
        background: #2563eb;
        border-radius: 8px;
        color: #fff;
        display: flex;
        font-size: 22px;
        font-weight: 900;
        height: 58px;
        justify-content: center;
        width: 58px;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      p {
        color: #64748b;
        font-size: 14px;
        margin: 0;
      }

      a {
        align-items: center;
        background: #172033;
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-size: 15px;
        font-weight: 800;
        justify-content: center;
        margin-top: 4px;
        min-height: 46px;
        padding: 0 18px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W7</div>
      <h1>Returning to Word7000</h1>
      <p>Your sign-in is complete.</p>
      <a id="open-app" href="word7000://auth/callback">Open Word7000</a>
    </main>
    <script>
      (function returnToApp() {
        var callbackUrl = 'word7000://auth/callback' + window.location.search + window.location.hash;
        document.getElementById('open-app').href = callbackUrl;
        window.location.replace(callbackUrl);
      })();
    </script>
  </body>
</html>
